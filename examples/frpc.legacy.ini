; Older Android frpc clients may only accept INI. Match client/server versions.
[common]
server_addr = YOUR_SERVER_IP_OR_DOMAIN
server_port = 7000
token = REPLACE_WITH_FRP_SHARED_SECRET
tls_enable = true
login_fail_exit = false

[aw-my-android]
type = tcp
local_ip = 127.0.0.1
local_port = 5600
remote_port = 7075
